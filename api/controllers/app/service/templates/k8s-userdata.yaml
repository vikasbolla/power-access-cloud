#cloud-config
runcmd:
  - |
    {
      set -xe
      echo "--- PAC K8S BOOTSTRAP START ---"

      # 1. Inject SSH keys for root — done first, before anything else, so SSH
      #    access is available even if a later step fails.
      mkdir -p /root/.ssh
      chmod 700 /root/.ssh
      printf '%s\n' '{{.Keys}}' >> /root/.ssh/authorized_keys
      chmod 600 /root/.ssh/authorized_keys
      restorecon -Rv /root/.ssh 2>/dev/null || true

      # 2. Disable swap (required by kubeadm)
      swapoff -a
      sed -i '/swap/d' /etc/fstab

      # 3. Load required kernel modules
      modprobe overlay
      modprobe br_netfilter
      printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf

      # 4. Set sysctl params
      printf 'net.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward = 1\n' > /etc/sysctl.d/k8s.conf
      sysctl --system

      # 5. Install containerd and runc from Docker's official repo
      #    (containerd is not in default CentOS Stream 9 repos)
      dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      dnf install -y containerd.io
      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      systemctl enable --now containerd

      # 6. Add Kubernetes repo and install kubeadm, kubelet, kubectl
      printf '[kubernetes]\nname=Kubernetes\nbaseurl=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/\nenabled=1\ngpgcheck=1\ngpgkey=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/repodata/repomd.xml.key\n' > /etc/yum.repos.d/kubernetes.repo
      dnf install -y kubelet kubeadm kubectl --disableexcludes=kubernetes
      systemctl enable --now kubelet

      # 7. Fetch external IP from IBM Cloud metadata service so kubeadm
      #    includes it as a SAN in the API server TLS certificate.
      #    This allows kubectl to connect from outside the VM without
      #    TLS verification errors.
      EXTERNAL_IP=$(curl -sf http://169.254.169.254/latest/meta-data/public-ipv4 || echo "")

      # 8. Bootstrap the single-node cluster
      #    Always include the internal IP and common SANs.
      #    Append the external IP as an extra SAN if we got one.
      EXTRA_SANS="kubernetes,kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local"
      if [ -n "$EXTERNAL_IP" ]; then
        EXTRA_SANS="${EXTRA_SANS},${EXTERNAL_IP}"
      fi
      kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-cert-extra-sans="${EXTRA_SANS}"

      # 9. Place kubeconfig for root — kubectl works immediately on SSH login
      mkdir -p /root/.kube
      cp /etc/kubernetes/admin.conf /root/.kube/config
      chmod 600 /root/.kube/config
      echo 'export KUBECONFIG=/root/.kube/config' >> /root/.bashrc
      export KUBECONFIG=/root/.kube/config

      # 10. Untaint control-plane so pods can schedule on this single node
      kubectl taint nodes --all node-role.kubernetes.io/control-plane-

      # 11. Install Flannel CNI (pods won't start without a CNI)
      kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

      # 12. Make a ready-to-use kubeconfig for remote access.
      #     If we have the external IP, patch the server address so the
      #     downloaded kubeconfig works from a laptop without any sed edits.
      cp /root/.kube/config /root/kubeconfig
      if [ -n "$EXTERNAL_IP" ]; then
        sed -i "s/$(hostname -I | awk '{print $1}')/${EXTERNAL_IP}/g" /root/kubeconfig
        sed -i "s/192\.168\.[0-9]*\.[0-9]*/${EXTERNAL_IP}/g" /root/kubeconfig
      fi
      chmod 644 /root/kubeconfig

      echo "--- PAC K8S BOOTSTRAP COMPLETE ---"
    } > /tmp/pac-k8s-bootstrap.log 2>&1
